    <!-- Firebase 실시간 클라우드 동기화 모듈 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.__jokguCloudSync = {
            enabled: false,
            db: null,
            auth: null,
            user: null,
            appId: window.__app_id || 'jokgu-scoreboard-app',
            unsubscribe: null,
            init: async function () {
                try {
                    if (!window.__firebase_config) return false;
                    const firebaseConfig = JSON.parse(window.__firebase_config);
                    const app = initializeApp(firebaseConfig);
                    this.auth = getAuth(app);
                    this.db = getFirestore(app);

                    const cred = await signInAnonymously(this.auth);
                    this.user = cred.user;
                    this.enabled = true;
                    return true;
                } catch (err) {
                    console.warn('Cloud sync fallback to local/BroadcastChannel:', err);
                    return false;
                }
            },
            subscribeRoom: function (roomCode, onDataCallback) {
                if (!this.enabled || !this.user || !this.db) return;
                if (this.unsubscribe) {
                    this.unsubscribe();
                    this.unsubscribe = null;
                }
                const safeRoom = (roomCode || 'jokgu-live').trim().replace(/[^a-zA-Z0-9_-]/g, '_') || 'jokgu-live';
                const roomRef = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'jokgu_rooms', safeRoom);
                this.unsubscribe = onSnapshot(roomRef, (snap) => {
                    if (snap.exists()) {
                        onDataCallback(snap.data());
                    }
                }, (err) => {
                    console.warn('Room snapshot error:', err);
                });
            }
        };

        window.dispatchEvent(new Event('jokgu-cloud-ready'));
    </script>

                    <ellipse cx="50" cy="50" rx="46.5" ry="42" fill="#FFFFFF"/>

            const topBadge = document.getElementById('serve-badge-top');

        }

        function getChevronSVG(direction, color) {
            const isUp = (direction === 'up');
            const rotation = isUp ? 'rotate(180 18 12)' : 'rotate(0 18 12)';
            return `
            <svg viewBox="0 0 36 24" class="w-full h-full">
                <g transform="${rotation}" style="transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);">
                    <path d="M6.5 6.8 L18 18.2 L29.5 6.8" fill="none" stroke="rgba(0,0,0,0.34)" stroke-width="11.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M6.5 6.8 L18 18.2 L29.5 6.8" fill="none" stroke="${color}" stroke-width="8.8" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
            </svg>`;
        }

        function updateLayoutSpacing() {
            const titleEl = document.getElementById('display-title-bar');
            const venueEl = document.getElementById('display-venue');
            if (!titleEl || !venueEl) return;

            const chProbe = document.createElement('span');
            chProbe.style.cssText = 'position:absolute;visibility:hidden;font-size:18px;font-weight:700;white-space:nowrap;';
            chProbe.textContent = '0';
            document.body.appendChild(chProbe);
            const quarterSpaceWidth = Math.ceil(chProbe.getBoundingClientRect().width * 0.25);
            chProbe.remove();

            const setCount = state.sets.length;
            const setsAreaWidth = setCount * 58;

            const venueMinLeftWidth = Math.ceil(venueEl.scrollWidth) + 32 + quarterSpaceWidth;
            const titleTotalRequiredWidth = Math.ceil(titleEl.scrollWidth) + 32 + quarterSpaceWidth;
            const titleMinLeftWidth = Math.max(0, titleTotalRequiredWidth - setsAreaWidth);

            const minBaseLeftWidth = 290;
            const leftColWidth = Math.max(minBaseLeftWidth, venueMinLeftWidth, titleMinLeftWidth);

            document.documentElement.style.setProperty('--left-col-w', `${leftColWidth}px`);
        }

        function fitTexts() {
            updateLayoutSpacing();

            const topNameEl = document.getElementById('display-top-name');
            const bottomNameEl = document.getElementById('display-bottom-name');
            const leftColEl = document.getElementById('top-team-left-col');
            const defaultTeamSize = 24;
            const minTeamSize = 14;

            if (topNameEl && bottomNameEl && leftColEl) {
                const availableTeamWidth = Math.max(150, leftColEl.offsetWidth - 96);

                topNameEl.style.fontSize = `${defaultTeamSize}px`;
                bottomNameEl.style.fontSize = `${defaultTeamSize}px`;

                const topWidth = topNameEl.scrollWidth;
                const bottomWidth = bottomNameEl.scrollWidth;

                const sizeA = topWidth > availableTeamWidth
                    ? Math.max(minTeamSize, Math.floor(defaultTeamSize * (availableTeamWidth / topWidth) * 10) / 10)
                    : defaultTeamSize;

                const sizeB = bottomWidth > availableTeamWidth
                    ? Math.max(minTeamSize, Math.floor(defaultTeamSize * (availableTeamWidth / bottomWidth) * 10) / 10)
                    : defaultTeamSize;

                const syncedSize = Math.min(sizeA, sizeB);
                topNameEl.style.fontSize = `${syncedSize}px`;
                bottomNameEl.style.fontSize = `${syncedSize}px`;
            }

                <div class="inline-flex items-center gap-1 bg-white border border-slate-300/90 rounded-md px-2 py-0.5 whitespace-nowrap shrink-0">
                    <span class="text-[11px] font-extrabold text-[#0F2350] leading-none">${p.position}</span>
                    <span class="text-[15.5px] font-black text-[#111111] leading-none">${p.name}</span>
                    ${p.note ? `<span class="text-[10.5px] font-bold text-slate-500 leading-none">${p.note}</span>` : ''}
                </div>
            `;

            const isTwoRows = players.length > 4;
            let playersContentHTML = '';

            if (players.length === 0) {
                playersContentHTML = `<span class="text-xs font-bold text-slate-500 whitespace-nowrap">등록된 선수가 없습니다</span>`;
            } else if (!isTwoRows) {
                playersContentHTML = `
                    <div class="lineup-row-single">
                        ${players.map(renderBadge).join('')}
                    </div>
                `;
            } else {
                const splitIdx = Math.ceil(players.length / 2);
                const topRowPlayers = players.slice(0, splitIdx);
                const bottomRowPlayers = players.slice(splitIdx);
                playersContentHTML = `
                    <div class="flex flex-col items-start justify-center gap-1.5 w-max">
                        <div class="lineup-row-single">
                            ${topRowPlayers.map(renderBadge).join('')}
                        </div>
                        <div class="lineup-row-single">
                            ${bottomRowPlayers.map(renderBadge).join('')}
                        </div>
                    </div>
                `;
            }

            const barMinHeightClass = isTwoRows ? 'min-h-[64px]' : 'h-[44px]';
            const playersPaddingClass = isTwoRows ? 'py-1.5 px-3' : 'px-3';

            return `
                <div class="lower-third-bar ${barMinHeightClass}">
                    <div style="background-color: ${teamColor};" class="w-[8px] shrink-0 self-stretch"></div>
                    <div class="bg-[#FFFFFF] text-[#111111] px-3.5 flex items-center gap-2 shrink-0 self-stretch">
                        <div class="shrink-0 w-[26px] h-[18px] flex items-center justify-center">${arrowSVG}</div>
                        <span class="text-[18px] font-extrabold tracking-tight whitespace-nowrap leading-none">${teamName}</span>
                    </div>
                    <div class="bg-[#1E293B] text-amber-300 px-2.5 flex items-center shrink-0 self-stretch">
                        <span class="text-[12.5px] font-extrabold tracking-tight whitespace-nowrap leading-none">출전 명단</span>
                    </div>
                    <div class="bg-[#F8FAFC] ${playersPaddingClass} flex items-center shrink-0">
                        ${playersContentHTML}
                    </div>
                </div>
            `;
        }

        function render(popTarget = null) {
            state.topTeam.color = COLOR_BLUE;
            state.bottomTeam.color = COLOR_RED;

            const titleText = state.date.trim()
                ? `${state.tournament} (${state.date.trim()})`
                : state.tournament;
            document.getElementById('display-title-bar').textContent = titleText;
            document.getElementById('display-venue').textContent = state.venue;

            document.getElementById('display-top-name').textContent = state.topTeam.name || '팀 A';
            document.getElementById('display-bottom-name').textContent = state.bottomTeam.name || '팀 B';

            document.getElementById('top-arrow-container').innerHTML = getChevronSVG(state.topTeam.direction, COLOR_BLUE);
            document.getElementById('bottom-arrow-container').innerHTML = getChevronSVG(state.bottomTeam.direction, COLOR_RED);

            const serveTopEl = document.getElementById('serve-badge-top');
            const serveBottomEl = document.getElementById('serve-badge-bottom');
            if (state.serveTeam === 'top') {
                serveTopEl.classList.remove('hidden');
                serveBottomEl.classList.add('hidden');
            } else {
                serveTopEl.classList.add('hidden');
                serveBottomEl.classList.remove('hidden');
            }

            const headersContainer = document.getElementById('set-headers-container');
            const topScoresContainer = document.getElementById('top-scores-container');
            const bottomScoresContainer = document.getElementById('bottom-scores-container');

            let headersHTML = '';
            let topScoresHTML = '';
            let bottomScoresHTML = '';

            state.sets.forEach((setObj, idx) => {
                const isActive = (idx === state.activeSet);
                headersHTML += `
                    <div style="color: #FFFFFF; font-weight: 800; opacity: 1;" class="sb-set-col flex items-center justify-center select-none">
                        <span class="leading-none tracking-tight">${idx + 1}SET</span>
                    </div>
                `;

                const cellBg = isActive ? '#001B7A' : '#FFFFFF';
                const cellText = isActive ? '#FFFFFF' : '#111827';
                const topPop = (popTarget && popTarget.team === 'top' && popTarget.setIdx === idx) ? 'score-pop' : '';
                const bottomPop = (popTarget && popTarget.team === 'bottom' && popTarget.setIdx === idx) ? 'score-pop' : '';

                topScoresHTML += `
                    <div style="background-color: ${cellBg}; color: ${cellText}; opacity: 1;" class="sb-set-col flex items-center justify-center transition-colors duration-200">
                        <span class="font-score text-[27px] font-black leading-none ${topPop}">${setObj.top}</span>
                    </div>
                `;

                bottomScoresHTML += `
                    <div style="background-color: ${cellBg}; color: ${cellText}; opacity: 1;" class="sb-set-col flex items-center justify-center transition-colors duration-200">
                        <span class="font-score text-[27px] font-black leading-none ${bottomPop}">${setObj.bottom}</span>
                    </div>
                `;
            });

            headersContainer.innerHTML = headersHTML;
            topScoresContainer.innerHTML = topScoresHTML;
            bottomScoresContainer.innerHTML = bottomScoresHTML;

            requestAnimationFrame(fitTexts);
        }

        function syncOverlayVisibility() {
            const cardEl = document.getElementById('scoreboard-card');
            const bannerEl = document.getElementById('player-banner-wrapper');

            cardEl.classList.remove('overlay-on', 'overlay-off-live');
            if (state.overlayVisible) {
                cardEl.classList.add('overlay-on');
            } else {
                cardEl.classList.add('overlay-off-live');
            }

            const pb = state.playerBanner;
            if (pb.mode === 'sequence') {
                const activeSlot = pb.sequenceStep === 1 ? 'bottom' : 'top';
                bannerEl.innerHTML = buildTeamLineupBarHTML(activeSlot);
            } else if (pb.mode === 'team') {
                bannerEl.innerHTML = buildTeamLineupBarHTML(pb.slot || 'top');
            } else {
                const isBottomSlot = (pb.slot === 'bottom');
                const slotTeamState = isBottomSlot ? state.bottomTeam : state.topTeam;
                const slotTeamColor = isBottomSlot ? COLOR_RED : COLOR_BLUE;
                const slotTeamDirection = slotTeamState.direction;
                const arrowSVG = getChevronSVG(slotTeamDirection, slotTeamColor);
                const liveTeamName = isBottomSlot ? (state.bottomTeam.name || pb.teamName) : (state.topTeam.name || pb.teamName);
                const noteHTML = pb.note
                    ? `<span class="text-[12.5px] font-bold text-slate-500 whitespace-nowrap leading-none">${pb.note}</span>`
                    : '';

                bannerEl.innerHTML = `
                    <div class="lower-third-bar h-[44px]">
                        <div style="background-color: ${slotTeamColor};" class="w-[8px] shrink-0"></div>
                        <div class="bg-[#FFFFFF] text-[#111111] px-3.5 flex items-center gap-2 shrink-0">
                            <div class="shrink-0 w-[26px] h-[18px] flex items-center justify-center">${arrowSVG}</div>
                            <span class="text-[18px] font-extrabold tracking-tight whitespace-nowrap leading-none">${liveTeamName}</span>
                        </div>
                        <div class="bg-[#1E293B] text-amber-300 px-3 flex items-center shrink-0">
                            <span class="text-[14px] font-extrabold tracking-tight whitespace-nowrap leading-none">${pb.position}</span>
                        </div>
                        <div class="bg-[#F8FAFC] text-[#111111] px-4 flex items-center gap-2 shrink-0">
                            <span class="text-[20px] font-black tracking-tight whitespace-nowrap leading-none">${pb.playerName}</span>
                            ${noteHTML}
                        </div>
                    </div>
                `;
            }

            bannerEl.classList.remove('banner-on', 'banner-off-live');
            const renderedCard = bannerEl.querySelector('.lower-third-bar');
            const naturalBannerWidth = renderedCard ? renderedCard.offsetWidth : 0;
            const maxOverlayWidth = Math.max(320, window.innerWidth - 48);
            const autoFitScale = (naturalBannerWidth > maxOverlayWidth)
                ? Math.max(0.45, Math.floor((maxOverlayWidth / naturalBannerWidth) * 1000) / 1000)
                : 1;

            bannerEl.style.transform = autoFitScale < 1 ? `scale(${autoFitScale})` : 'none';

            if (pb.visible) {
                bannerEl.classList.add('banner-on');
            } else {
                bannerEl.classList.add('banner-off-live');
            }
        }

        function applyIncomingLivePayload(payload) {
            if (!payload || payload.senderId === INSTANCE_SENDER_ID) return;
            if (payload.roomCode && payload.roomCode !== state.roomCode) return;
            if (payload.updatedAt && payload.updatedAt <= lastAppliedTimestamp) return;
            lastAppliedTimestamp = payload.updatedAt || Date.now();

            state.tournament = payload.tournament ?? state.tournament;
            state.date = payload.date ?? state.date;
            state.venue = payload.venue ?? state.venue;
            if (Array.isArray(payload.sets) && payload.sets.length > 0) state.sets = payload.sets;
            if (typeof payload.activeSet === 'number') state.activeSet = payload.activeSet;
            if (payload.serveTeam) state.serveTeam = payload.serveTeam;
            if (typeof payload.overlayVisible === 'boolean') state.overlayVisible = payload.overlayVisible;
            if (payload.topTeam) state.topTeam = { ...payload.topTeam, color: COLOR_BLUE };
            if (payload.bottomTeam) state.bottomTeam = { ...payload.bottomTeam, color: COLOR_RED };
            if (payload.loadedTopTeamId) state.loadedTopTeamId = payload.loadedTopTeamId;
            if (payload.loadedBottomTeamId) state.loadedBottomTeamId = payload.loadedBottomTeamId;
            if (payload.playerBanner) state.playerBanner = payload.playerBanner;

            if (Array.isArray(payload.topRosterPlayers)) {
                const idx = state.savedTeams.findIndex(t => t.id === state.loadedTopTeamId);
                if (idx >= 0) state.savedTeams[idx].players = payload.topRosterPlayers;
                else state.savedTeams.push({ id: state.loadedTopTeamId, name: state.topTeam.name, players: payload.topRosterPlayers });
            }
            if (Array.isArray(payload.bottomRosterPlayers)) {
                const idx = state.savedTeams.findIndex(t => t.id === state.loadedBottomTeamId);
                if (idx >= 0) state.savedTeams[idx].players = payload.bottomRosterPlayers;
                else state.savedTeams.push({ id: state.loadedBottomTeamId, name: state.bottomTeam.name, players: payload.bottomRosterPlayers });
            }

            render();
            syncOverlayVisibility();
        }

        window.addEventListener('resize', () => {
            fitTexts();
            syncOverlayVisibility();
        });

        if (liveChannel) {
            liveChannel.onmessage = (event) => {
                applyIncomingLivePayload(event.data);
            };
        }

        window.addEventListener('storage', (event) => {
            if (event.key === `${STORAGE_KEY_LIVE_PAYLOAD}_${state.roomCode}` && event.newValue) {
                try {
                    applyIncomingLivePayload(JSON.parse(event.newValue));
                } catch (e) {}
            }
        });

        async function initCloudConnection() {
            if (!window.__jokguCloudSync) return;
            const ok = await window.__jokguCloudSync.init();
            if (ok) {
                window.__jokguCloudSync.subscribeRoom(state.roomCode, applyIncomingLivePayload);
            }
        }

        window.addEventListener('jokgu-cloud-ready', initCloudConnection);

        window.addEventListener('DOMContentLoaded', () => {
            try {
                const cachedRaw = localStorage.getItem(`${STORAGE_KEY_LIVE_PAYLOAD}_${state.roomCode}`);
                if (cachedRaw) applyIncomingLivePayload(JSON.parse(cachedRaw));
            } catch (e) {}

            initJokguBallIcons();
            render();
            syncOverlayVisibility();
            initCloudConnection();
        });
    </script>
</body>
</html>
